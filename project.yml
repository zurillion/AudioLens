name: AudioLens
options:
  bundleIdPrefix: org.audiolens
  deploymentTarget:
    macOS: "26.0"
  developmentLanguage: en
  xcodeVersion: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    ENABLE_HARDENED_RUNTIME: YES

targets:
  AudioLens:
    type: application
    platform: macOS
    sources:
      - path: AudioLens
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.audiolens.AudioLens
        PRODUCT_NAME: AudioLens
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright © 2026. Licensed under GPL-3.0-or-later."
        INFOPLIST_KEY_NSMainStoryboardFile: ""
        INFOPLIST_KEY_NSPrincipalClass: NSApplication
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.music"
        CODE_SIGN_ENTITLEMENTS: AudioLens/AudioLens.entitlements
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_STRICT_CONCURRENCY: complete
        SWIFT_UPCOMING_FEATURE_EXISTENTIAL_ANY: YES
